services:
  - type: web
    name: asm-sistem-stor
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: "Sistem Pengurusan Stor Kerajaan (ASM)"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kuala_Lumpur
      - key: APP_LOCALE
        value: ms
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false # Masukkan sambungan URI Supabase di Render Dashboard
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
